[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"            # safest broadly-supported hardfork; confirm Somnia's target in the Plan 4 spike
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network"
